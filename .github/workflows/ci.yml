name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4   # sustituye al cache: de GitLab
      - run: ./gradlew assemble
      - uses: actions/upload-artifact@v4      # = artifacts: de GitLab
        with:
          name: jar
          path: build/libs/*.jar

  test:
    needs: build                              # = stages: en orden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      - uses: actions/upload-artifact@v4
        if: always()                          # = when: always
        with:
          name: test-results
          path: build/test-results/test/

  docker:
    needs: [build, test]                     # no construye la imagen si fallan los tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                         # permite a GITHUB_TOKEN subir a ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository }}  # ghcr.io/idcumm/individual-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4    # recupera el jar del job build
        with:
          name: jar
          path: build/libs
      - run: docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .   # el runner ya trae Docker, no hace falta dind
      - if: github.event_name == 'push'       # en pull requests solo se construye, no se sube
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # token automático, no hay que crear secrets
      - if: github.event_name == 'push'
        run: docker push --all-tags $IMAGE
