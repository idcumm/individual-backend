services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: studentfinance
      POSTGRES_USER: sf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf -d studentfinance"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    image: ghcr.io/idcumm/individual-backend:latest
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/studentfinance
      DB_USER: sf
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: ghcr.io/idcumm/individual-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on: [backend]

volumes:
  pgdata:
